<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha | SNEF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #2b2142;
            --accent: #008080;
            --bg: #f4f2f8;
            --error: #d9534f;
            --success: #2e7d32;
        }

        * {
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            max-width: 420px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            text-align: center;
        }

        img {
            max-width: 140px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .msg {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .error {
            background: rgba(217,83,79,0.1);
            color: var(--error);
        }

        .success {
            background: rgba(46,125,50,0.1);
            color: var(--success);
        }
    </style>
</head>

<body>

<div class="container">
    <img src="/src/assets/snef_fr.jpg">
    <h1>Redefinir senha</h1>

    <input type="password" id="password" placeholder="Nova senha">
    <input type="password" id="confirm" placeholder="Confirmar senha">

    <button id="btn">Salvar nova senha</button>

    <div id="msg" class="msg"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search)
const token = params.get('token')
const btn = document.getElementById('btn')
const msg = document.getElementById('msg')

btn.onclick = async () => {
    const password = document.getElementById('password').value
    const confirm = document.getElementById('confirm').value

    if (!token || password !== confirm || !password) {
        msg.className = 'msg error'
        msg.textContent = 'Dados inválidos.'
        msg.style.display = 'block'
        return
    }

    btn.disabled = true
    btn.textContent = 'Salvando...'

    try {
        const res = await fetch(`http://localhost:3000/api/auth/reset-password/${token}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        })

        if (!res.ok) throw new Error()

        msg.className = 'msg success'
        msg.textContent = 'Senha alterada com sucesso!'
        msg.style.display = 'block'

        setTimeout(() => location.href = 'login.html', 3000)
    } catch {
        msg.className = 'msg error'
        msg.textContent = 'Erro ao redefinir senha.'
        msg.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'Salvar nova senha'
    }
}
</script>

</body>
</html>
