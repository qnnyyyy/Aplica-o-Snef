<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEF - Perfil do Usuário</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        (function() {
            if (!localStorage.getItem('token')) window.location.href = 'login.html';
        })();
    </script>
    <style>
        :root {
            --cor-fundo: #F4F7F9;
            --cor-azul-snef: #368D6D;
            --cor-card: #FFFFFF;
            --cor-texto: #333;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--cor-fundo);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--cor-card);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { color: var(--cor-azul-snef); margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-save {
            width: 100%;
            padding: 12px;
            background: var(--cor-azul-snef);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            margin-top: 15px;
            padding: 8px;
            border-radius: 4px;
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
            transition: background 0.2s, color 0.2s;
        }
        .btn-back:hover { background: rgba(54, 141, 109, 0.08); color: var(--cor-azul-snef); }
        .btn-logout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px;
            background: #D9534F;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .btn-logout:hover { opacity: 0.9; }
        #message { margin-top: 15px; text-align: center; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <h2>Meu Perfil</h2>
    <form id="user-form">
        <div class="form-group">
            <label>E-mail (Login)</label>
            <input type="text" id="user-email" disabled>
        </div>
        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="user-name" required>
        </div>
        <div class="form-group">
            <label>Nova Senha (deixe em branco para manter)</label>
            <input type="password" id="user-password" placeholder="******">
        </div>
        <button type="submit" class="btn-save">Salvar Alterações</button>
    </form>
    <a href="index.html" class="btn-back"><i class="fa-solid fa-house"></i> Voltar para Home</a>
    <button id="btn-logout" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    <div id="message"></div>
</div>

<script type="module" src="./src/controllers/usuario.js"></script>
<script>
    document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'login.html';
    });
</script>
</body>
</html>
