<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEF - Gerenciar Estações</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        (function() {
            if (!localStorage.getItem('token')) window.location.href = 'login.html';
            if (!['admin', 'dono'].includes((localStorage.getItem('role') || '').toLowerCase())) window.location.href = 'index.html';
        })();
    </script>
    <style>
        :root {
            --cor-fundo-principal: #F4F7F9;
            --cor-texto-principal: #333333;
            --cor-azul-snef: #368D6D; 
            --cor-borda-detalhe: #E0E0E0;
            --cor-card-fundo: #FFFFFF;
            --cor-destaque-shadow: rgba(0, 0, 0, 0.1); 
            --cor-botao-fundo: #368D6D; 
            --cor-botao-hover: #286B52; 
            --cor-logout: #D9534F;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--cor-fundo-principal);
            color: var(--cor-texto-principal);
            margin: 0; 
            padding: 15px;
        }

        #header-snef {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 25px; 
            border-bottom: 2px solid var(--cor-borda-detalhe);
            padding-bottom: 15px; 
            max-width: 1200px; 
            margin: 0 auto;
            position: relative;
        }

        #header-snef h1 {
            font-size: 1.6em; 
            color: var(--cor-azul-snef); 
            text-transform: uppercase;
            letter-spacing: 2px; 
            margin: 0; 
            font-weight: 700;
        }

        .header-controls { display: flex; gap: 10px; }

        .animated-button {
            display: flex; 
            align-items: center; 
            gap: 6px; 
            padding: 8px 16px;
            background-color: var(--cor-botao-fundo); 
            color: #FFFFFF; 
            border: none;
            border-radius: 4px; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease; 
            box-shadow: 0 2px 5px var(--cor-destaque-shadow);
            font-weight: 500;
        }

        .animated-button:hover {
            background-color: var(--cor-botao-hover);
            transform: translateY(-1px);
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background-color: var(--cor-logout);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-logout:hover { opacity: 0.9; transform: translateY(-1px); }

        .container {
            max-width: 1200px; 
            margin: 0 auto; 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px;
        }

        .card {
            background: var(--cor-card-fundo); 
            padding: 20px; 
            border-radius: 6px;
            border: 1px solid var(--cor-borda-detalhe); 
            box-shadow: 0 4px 15px var(--cor-destaque-shadow);
        }

        .card h2 { 
            color: var(--cor-azul-snef); 
            margin-top: 0; 
            border-bottom: 1px solid var(--cor-borda-detalhe); 
            padding-bottom: 10px;
            font-size: 1.3em;
        }

        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group label { font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        .form-group input {
            padding: 12px; 
            border: 1px solid var(--cor-borda-detalhe); 
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1em;
            width: 100%;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            body { padding: 20px; }
            #header-snef h1 { position: absolute; left: 50%; transform: translateX(-50%); font-size: 2.2em; }
            .card { padding: 25px; }
            .card h2 { font-size: 1.5em; }
        }

        @media (max-width: 480px) {
            #header-snef h1 { font-size: 1.4em; letter-spacing: 1px; }
            .animated-button { padding: 8px 12px; font-size: 0.85em; }
        }
    </style>
</head>
<body>

<header id="header-snef">
    <div class="header-controls">
        <a href="index.html" style="text-decoration:none"><button class="animated-button"><i class="fa-solid fa-house"></i> Home</button></a>
    </div>
    <h1>SNEF</h1>
    <button id="btn-logout" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
</header>

<div class="container" style="max-width:600px">
    <div class="card">
        <h2><i class="fa-solid fa-building"></i> Dados da Estação</h2>
        <p style="font-size:0.85em;color:#666;margin-top:-8px">
            Esta é a sua localidade — o mesmo nome que aparece no seletor de Localização. Zonas e câmeras já pertencem a ela automaticamente.
        </p>
        <form id="station-form">
            <div class="form-group">
                <label>Nome da Estação</label>
                <input type="text" id="name" placeholder="Ex: Linha 11 Prata" required>
            </div>
            <div class="form-group">
                <label>Localização / Endereço</label>
                <input type="text" id="location" placeholder="Ex: Av. Paulista, 1000 - São Paulo/SP">
            </div>
            <button type="submit" class="animated-button" style="width: 100%; justify-content: center;"><i class="fa-solid fa-floppy-disk"></i> Salvar Alterações</button>
            <div id="feedback" style="font-size:0.85em;padding:10px;border-radius:6px;display:none;margin-top:12px"></div>
        </form>
    </div>
</div>

<script type="module" src="./src/controllers/station.js"></script>
<script>
    document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'login.html';
    });
</script>
</body>
</html>
