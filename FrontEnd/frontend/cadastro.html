<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEF - Cadastro</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cor-fundo: #F4F7F9;
            --cor-primaria: #368D6D;
            --cor-hover: #286B52;
            --cor-texto: #333333;
            --cor-card: #FFFFFF;
            --cor-borda: #E0E0E0;
            --cor-erro: #D9534F;
            --cor-sombra: rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh; 
            background-color: var(--cor-fundo);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background-color: var(--cor-card);
            padding: 40px 30px; 
            border-radius: 8px;
            box-shadow: 0 8px 25px var(--cor-sombra);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo img {
            max-width: 180px; 
            height: auto;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--cor-texto);
            font-size: 1.5em;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--cor-borda);
            font-family: 'Montserrat', sans-serif;
            font-size: 16px; 
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cor-primaria);
            box-shadow: 0 0 0 2px rgba(54, 141, 109, 0.1);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background-color: var(--cor-primaria);
            border: none;
            border-radius: 4px;
            color: #FFFFFF;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-register:hover {
            background-color: var(--cor-hover);
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .login-link {
            margin-top: 20px;
            font-size: 0.9em;
        }

        .login-link a {
            color: var(--cor-primaria);
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            margin-top: 15px;
            padding: 10px;
            background-color: rgba(217, 83, 79, 0.1);
            border-radius: 4px;
            color: var(--cor-erro);
            font-size: 0.85em;
            display: none;
        }

        #success-modal {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
        }

        .modal-content {
            position: relative;
            background: var(--cor-card);
            width: 100%;
            max-width: 360px;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-content h3 {
            margin: 0 0 10px 0;
            color: var(--cor-primaria);
        }

        .modal-content p {
            margin-bottom: 25px;
            font-size: 1em;
            color: #555;
            line-height: 1.4;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            background-color: var(--cor-primaria);
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-height: 600px) {
            body {
                align-items: flex-start;
                padding-top: 20px;
            }
            .logo img {
                max-width: 140px;
                margin-bottom: 10px;
            }
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--cor-borda);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px 6px 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab-btn.active {
            color: var(--cor-primaria);
            border-bottom-color: var(--cor-primaria);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .autocomplete-wrap { position: relative; }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--cor-borda);
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 190px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
        }

        .suggestions-list.open { display: block; }

        .suggestion-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 0.95em;
            text-align: left;
        }

        .suggestion-item:hover, .suggestion-item.active-item {
            background: var(--cor-fundo);
            color: var(--cor-primaria);
        }

        .suggestion-empty {
            padding: 10px 12px;
            color: #999;
            font-size: 0.85em;
            text-align: left;
        }
    </style>
</head>
<body>

    <main class="register-container">
        <div class="logo">
            <img src="./src/assets/snef_fr.jpg" alt="SNEF">
        </div>

        <h2>Criar Conta</h2>

        <div class="tabs">
            <button type="button" class="tab-btn active" id="tab-btn-new" data-tab="new">Novo cadastro</button>
            <button type="button" class="tab-btn" id="tab-btn-owner" data-tab="owner">Já sou Dono, tenho conta</button>
        </div>

        <form id="register-form" class="tab-panel active" data-panel="new">
            <div class="form-group">
                <label for="name">Nome completo</label>
                <input type="text" id="name" placeholder="Seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="email@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmar senha</label>
                <input type="password" id="confirm-password" placeholder="Repita a senha" required>
            </div>

            <div class="form-group" style="border-top:1px solid var(--cor-borda); padding-top:15px; margin-top:5px;">
                <label>Tipo de conta</label>
                <div style="display:flex; flex-direction:column; gap:8px; font-size:0.9em; margin-top:4px;">
                    <label style="display:flex; align-items:center; gap:6px; font-weight:400;">
                        <input type="radio" name="account-type" value="viewer" id="account-type-viewer" checked style="width:auto;">
                        Operador (usuário comum de uma localidade existente)
                    </label>
                    <label style="display:flex; align-items:center; gap:6px; font-weight:400;">
                        <input type="radio" name="account-type" value="admin" id="account-type-admin" style="width:auto;">
                        Admin de uma localidade existente
                    </label>
                    <label style="display:flex; align-items:center; gap:6px; font-weight:400;">
                        <input type="radio" name="account-type" value="owner" id="account-type-owner" style="width:auto;">
                        Sou o Dono e vou criar minha primeira localidade
                    </label>
                </div>
            </div>

            <div class="form-group" id="group-location-select">
                <label for="location-search">Estação / Localidade</label>
                <div class="autocomplete-wrap">
                    <input type="text" id="location-search" placeholder="Digite o nome da estação..." autocomplete="off">
                    <input type="hidden" id="location-search-id">
                    <div id="location-suggestions" class="suggestions-list"></div>
                </div>
            </div>

            <div class="form-group" id="group-location-name" style="display:none;">
                <label for="location-name">Nome da Localidade/Estação</label>
                <input type="text" id="location-name" placeholder="Ex: Linha 11 Prata">
            </div>

            <div class="form-group" id="group-confirmation-key" style="display:none;">
                <label for="confirmation-key">Chave de Confirmação</label>
                <input type="password" id="confirmation-key" placeholder="Chave fornecida pela SNEF">
            </div>

            <p id="approval-hint" style="font-size:0.8em; color:#888; margin:0 0 10px;">
                Seu cadastro será enviado para aprovação do responsável pela localidade escolhida.
            </p>

            <button type="submit" class="btn-register">Cadastrar</button>
        </form>

        <form id="owner-location-form" class="tab-panel" data-panel="owner" style="display:none">
            <p style="font-size:0.85em; color:#666; margin-top:0;">
                Use os dados da sua conta já existente pra criar mais uma localidade. Você será o Dono dela.
            </p>

            <div class="form-group">
                <label for="owner-email">E-mail</label>
                <input type="email" id="owner-email" placeholder="email@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="owner-password">Senha</label>
                <input type="password" id="owner-password" placeholder="Sua senha de login" required>
            </div>

            <div class="form-group">
                <label for="owner-key">Chave de Dono</label>
                <input type="password" id="owner-key" placeholder="Chave de Dono fornecida pela SNEF" required>
            </div>

            <div class="form-group" style="border-top:1px solid var(--cor-borda); padding-top:15px; margin-top:5px;">
                <label for="owner-location-name">Nome da nova localidade</label>
                <input type="text" id="owner-location-name" placeholder="Ex: Linha 4 Amarela" required>
            </div>

            <button type="submit" class="btn-register">Criar localidade</button>
        </form>

        <div class="login-link">
            <span>Já tem uma conta?</span> <a href="login.html">Faça login</a>
        </div>

        <div class="error-message" id="error-message"></div>
    </main>

    <div id="success-modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <h3 id="success-title">Sucesso! 🎉</h3>
            <p id="success-text">Sua conta foi criada. Clique abaixo para acessar o sistema.</p>
            <button id="btn-ok">Ir para o Login</button>
        </div>
    </div>

    <script type="module" src="./src/controllers/cadastro.js"></script>

</body>
</html>
