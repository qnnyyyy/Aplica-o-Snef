<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEF - Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cor-fundo: #F4F7F9;
            --cor-primaria: #368D6D;
            --cor-hover: #286B52;
            --cor-texto: #333333;
            --cor-card: #FFFFFF;
            --cor-borda: #E0E0E0;
            --cor-erro: #D9534F;
            --cor-sombra: rgba(0, 0, 0, 0.12);
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--cor-fundo);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background-color: var(--cor-card);
            padding: 50px 45px;
            border-radius: 8px;
            box-shadow: 0 8px 25px var(--cor-sombra);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .logo img {
            max-width: 220px;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 25px;
            color: var(--cor-texto);
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--cor-borda);
            font-family: 'Montserrat', sans-serif;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cor-primaria);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--cor-primaria);
            border: none;
            border-radius: 4px;
            color: #FFFFFF;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: var(--cor-hover);
        }

        .register-link {
            margin-top: 15px;
            font-size: 0.95em;
        }

        .register-link a {
            color: var(--cor-primaria);
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .forgot-password {
            margin-top: 10px;
            font-size: 0.9em;
        }

        .forgot-password a {
            color: var(--cor-primaria);
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .error-message {
            margin-top: 15px;
            color: var(--cor-erro);
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <img src="./src/assets/snef_fr.jpg" alt="SNEF">
        </div>

        <h2>Acesso ao Sistema</h2>

        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="register-link">
            <a href="cadastro.html">Criar uma conta</a>
        </div>

        <div class="forgot-password">
            <a href="recsenha.html">Esqueci minha senha</a>
        </div>

        <div class="error-message" id="error-message"></div>
    </div>

    <script type="module" src="./src/controllers/login.js"></script>

</body>
</html>
